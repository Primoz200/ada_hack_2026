[project]
name = "backend"
version = "0.1.0"
description = "Rehabilitation monitoring backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "numpy>=2.0",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "joblib>=1.4",
]

[dependency-groups]
dev = ["httpx>=0.27", "mypy>=1.11", "pytest>=8.3", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
disallow_untyped_defs = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
