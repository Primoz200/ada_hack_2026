[project]
name = "platforma-backend"
version = "0.1.0"
description = "Platforma za spremljanje pacientov po odpustu (raziskovalni prototip)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.7",
    "numpy",
    "scipy",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
